{% extends "base.html" %}{% block content %}<h1>Create product</h1><p class="sub">Add a product to the billing catalog</p><section class="card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field"><label for="name">Product name</label><input id="name" name="name" required value="{{ request.POST.name }}"></div><div class="field"><label for="product_type">Product type</label><select id="product_type" name="product_type"><option value="">Select type</option>{% for value,label in product_types %}<option value="{{ value }}" {% if request.POST.product_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="field"><label for="sales_price">Sales price</label><input id="sales_price" name="sales_price" type="number" min="0.01" step="0.01" required value="{{ request.POST.sales_price }}"></div><div class="field"><label for="cost_price">Cost price</label><input id="cost_price" name="cost_price" type="number" min="0" step="0.01" value="{{ request.POST.cost_price|default:'0' }}"></div></div><label for="description">Description</label><textarea id="description" name="description" rows="3">{{ request.POST.description }}</textarea><h3>Applicable taxes</h3>{% for tax in taxes %}<label class="checkline"><input type="checkbox" name="taxes" value="{{ tax.pk }}"> {{ tax.name }} ({{ tax.rate }}%)</label>{% empty %}<p class="empty">No active tax rates available.</p>{% endfor %}<div class="actions"><button type="submit">Create product</button><a class="btn secondary" href="{% url 'app:product_list' %}">Cancel</a></div></form></section>{% endblock %}
