{% extends "base.html" %}{% block content %}<h1>Create subscription</h1><p class="sub">New subscriptions are created as drafts</p><section class="card"><form method="post">{% csrf_token %}<div class="form-grid">{% if customers %}<div><label>Customer</label><select name="customer_id" required><option value="">Select customer</option>{% for customer in customers %}<option value="{{ customer.pk }}" {% if request.POST.customer_id == customer.pk|stringformat:'s' %}selected{% endif %}>{{ customer.get_full_name|default:customer.email }}</option>{% endfor %}</select></div>{% endif %}<div><label>Plan</label><select name="plan_id" required>{% for plan in plans %}<option value="{{ plan.pk }}" {% if request.POST.plan_id == plan.pk|stringformat:'s' %}selected{% endif %}>{{ plan.name }} — ₹{{ plan.price }} (min {{ plan.minimum_quantity }})</option>{% endfor %}</select></div><div><label>Product ID</label><input name="product_id" type="number" min="1" required value="{{ request.POST.product_id }}"><small class="help">Enter the ID of an active product included in the selected plan.</small></div><div><label>Variant ID (optional)</label><input name="variant_id" type="number" min="1" value="{{ request.POST.variant_id }}"></div><div><label>Quantity</label><input name="quantity" type="number" min="1" value="{{ request.POST.quantity|default:'1' }}" required></div><div><label>Start date</label><input name="start_date" type="date" min="{{ today|date:'Y-m-d' }}" value="{{ request.POST.start_date }}" required></div><div><label>Payment terms</label><input name="payment_terms" maxlength="100" value="{{ request.POST.payment_terms|default:'Due on receipt' }}"></div></div><div class="actions"><button type="submit">Create draft subscription</button><a class="btn secondary" href="{% url 'app:subscription_list' %}">Cancel</a></div></form></section>{% endblock %}
